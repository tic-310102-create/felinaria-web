<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradientes y filtros -->
    <radialGradient id="grad-fondo-medallon" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#AA5822" />
      <stop offset="60%" stop-color="#884114" />
      <stop offset="100%" stop-color="#69300D" />
    </radialGradient>

    <radialGradient id="grad-oro-borde" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDB356" />
      <stop offset="70%" stop-color="#D48F37" />
      <stop offset="100%" stop-color="#B26E20" />
    </radialGradient>

    <filter id="sombra-suave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ==================== ANILLO EXTERIOR DE ENGRANAJE/SOL DORADO ==================== -->
  <g id="marco-exterior">
    <!-- Puntas exteriores triangulares (12 puntas) -->
    <g fill="url(#grad-oro-borde)" stroke="#1A1612" stroke-width="3" stroke-linejoin="round">
      <!-- 12 rayos -->
      <polygon points="250,5 268,45 232,45" />
      <polygon points="372,38 375,80 342,62" transform="rotate(30 250 250)" />
      <polygon points="372,38 375,80 342,62" transform="rotate(60 250 250)" />
      <polygon points="495,250 455,268 455,232" />
      <polygon points="372,38 375,80 342,62" transform="rotate(120 250 250)" />
      <polygon points="372,38 375,80 342,62" transform="rotate(150 250 250)" />
      <polygon points="250,495 232,455 268,455" />
      <polygon points="372,38 375,80 342,62" transform="rotate(210 250 250)" />
      <polygon points="372,38 375,80 342,62" transform="rotate(240 250 250)" />
      <polygon points="5,250 45,232 45,268" />
      <polygon points="372,38 375,80 342,62" transform="rotate(300 250 250)" />
      <polygon points="372,38 375,80 342,62" transform="rotate(330 250 250)" />
    </g>

    <!-- Círculo base dorado exterior -->
    <circle cx="250" cy="250" r="225" fill="url(#grad-oro-borde)" stroke="#1A1612" stroke-width="4" />

    <!-- Banda oscura intermedia con remaches -->
    <circle cx="250" cy="250" r="202" fill="#201C18" stroke="#14110E" stroke-width="3" />

    <!-- Círculo interior dorado -->
    <circle cx="250" cy="250" r="162" fill="url(#grad-oro-borde)" stroke="#14110E" stroke-width="4" />

    <!-- Remaches dorados en la banda oscura (12 remaches) -->
    <g fill="#EDB356" stroke="#945814" stroke-width="1.5">
      <circle cx="250" cy="68" r="8.5" />
      <circle cx="341" cy="92" r="8.5" />
      <circle cx="408" cy="159" r="8.5" />
      <circle cx="432" cy="250" r="8.5" />
      <circle cx="408" cy="341" r="8.5" />
      <circle cx="341" cy="408" r="8.5" />
      <circle cx="250" cy="432" r="8.5" />
      <circle cx="159" cy="408" r="8.5" />
      <circle cx="92" cy="341" r="8.5" />
      <circle cx="68" cy="250" r="8.5" />
      <circle cx="92" cy="159" r="8.5" />
      <circle cx="159" cy="92" r="8.5" />
    </g>
  </g>

  <!-- ==================== MEDALLÓN CENTRAL ==================== -->
  <g id="medallon-interior">
    <!-- Fondo circular terracota -->
    <circle cx="250" cy="250" r="148" fill="url(#grad-fondo-medallon)" stroke="#14110E" stroke-width="4" />

    <!-- Rayos de sol en cuadrante izquierdo -->
    <g stroke="#672F0B" stroke-width="2.5" fill="#B3652E" opacity="0.95">
      <!-- Sector de rayos -->
      <path d="M250,250 L110,210 A148,148 0 0,1 118,170 Z" />
      <path d="M250,250 L118,170 A148,148 0 0,1 138,134 Z" fill="#9C5220" />
      <path d="M250,250 L138,134 A148,148 0 0,1 170,114 Z" fill="#B3652E" />
      <path d="M250,250 L170,114 A148,148 0 0,1 210,105 Z" fill="#9C5220" />
      <path d="M250,250 L210,105 A148,148 0 0,1 250,102 Z" fill="#B3652E" />
      <path d="M250,250 L110,250 A148,148 0 0,1 110,210 Z" fill="#9C5220" />
      <path d="M250,250 L118,290 A148,148 0 0,1 110,250 Z" fill="#B3652E" />
      <path d="M250,250 L138,328 A148,148 0 0,1 118,290 Z" fill="#9C5220" />
    </g>

    <!-- Destellos / Estrellas de 4 puntas en el fondo -->
    <!-- Gran destello central -->
    <path d="M225,160 Q225,235 185,235 Q225,235 225,310 Q225,235 265,235 Q225,235 225,160 Z" 
          fill="#D6864A" opacity="0.85" />
    <path d="M225,190 Q225,235 200,235 Q225,235 225,280 Q225,235 250,235 Q225,235 225,190 Z" 
          fill="#E8A672" opacity="0.9" />

    <!-- Segundo destello pequeño inferior -->
    <path d="M248,245 Q248,270 232,270 Q248,270 248,295 Q248,270 264,270 Q248,270 248,245 Z" 
          fill="#F5ECD0" />

    <!-- ==================== SILUETA DEL GATO ==================== -->
    <!-- Cuerpo, cabeza, orejas y cola rizada en color crema/pergamino -->
    <g id="gato-silueta" fill="#F4ECD5" stroke="#1D1711" stroke-width="2.5" stroke-linejoin="round">
      <path d="
        M 270,150 
        C 258,150 258,162 260,165 
        C 250,166 244,175 250,180
        C 255,183 260,181 264,185
        C 264,198 274,210 285,218
        C 292,224 300,230 304,242
        C 310,260 310,290 295,325
        C 285,348 265,365 240,368
        C 205,372 170,358 152,335
        C 142,322 144,302 158,290
        C 170,280 188,284 194,298
        C 198,308 194,318 184,324
        C 176,328 168,324 165,316
        C 162,310 166,302 172,302
        C 176,302 178,306 176,310
        C 172,318 158,318 158,330
        C 160,348 190,362 225,358
        C 260,354 278,335 284,305
        C 288,282 284,260 274,244
        C 265,230 252,224 246,208
        C 240,192 244,176 255,168
        C 262,162 266,155 270,150 
        Z
      " />
      
      <!-- Cabeza y orejas detalladas -->
      <path d="
        M 270,150
        L 290,135
        C 292,148 296,154 308,152
        L 326,140
        C 328,155 330,165 322,176
        C 342,175 356,192 360,212
        C 365,238 358,272 342,305
        C 325,340 295,370 252,374
        C 258,368 266,358 266,350
        C 290,345 315,320 326,290
        C 336,260 338,230 334,208
        C 330,190 318,180 300,180
        C 285,180 275,165 270,150
        Z
      " />

      <!-- Pecho y postura frontal -->
      <path d="
        M 288,185
        C 275,200 265,225 264,255
        C 262,285 268,315 274,338
        C 280,315 278,285 280,260
        C 282,235 290,210 298,195
        Z
      " fill="#EDE1C4" stroke="none" />
    </g>

    <!-- Detalles del rostro: Ojo estrella, oreja y bigotes -->
    <!-- Estrella marrón en el rostro/ojo -->
    <polygon points="296,188 300,198 311,198 302,204 305,214 296,208 287,214 290,204 281,198 292,198" 
             fill="#8A4214" stroke="#5E2B0A" stroke-width="1.2" />

    <!-- Detalle interior oreja -->
    <path d="M298,150 L308,165 L316,152" fill="#E2CEA2" stroke="#8A4214" stroke-width="1.8" stroke-linecap="round" />

    <!-- Bigotes estilizados -->
    <g stroke="#8A4214" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M312,185 Q328,183 342,186" />
      <path d="M314,193 Q330,195 344,202" />
      <path d="M310,200 Q324,207 338,218" />
    </g>
  </g>

  <!-- ==================== ELEMENTOS HERÁLDICOS VERDES (NORTE Y SUR) ==================== -->
  <g id="cruces-verdes" filter="url(#sombra-suave)">
    <!-- Insignia superior (12 en punto) -->
    <path d="
      M 250,22 
      C 258,45 272,55 280,72
      C 266,75 258,90 250,135
      C 242,90 234,75 220,72
      C 228,55 242,45 250,22
      Z
    " fill="#4B6A45" stroke="#1D2A1C" stroke-width="3" stroke-linejoin="round" />
    <path d="M250,35 L250,115" stroke="#719468" stroke-width="2.5" stroke-linecap="round" />

    <!-- Insignia inferior (6 en punto) -->
    <path d="
      M 250,478 
      C 258,455 272,445 280,428
      C 266,425 258,410 250,365
      C 242,410 234,425 220,428
      C 228,445 242,455 250,478
      Z
    " fill="#4B6A45" stroke="#1D2A1C" stroke-width="3" stroke-linejoin="round" />
    <path d="M250,465 L250,385" stroke="#719468" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
